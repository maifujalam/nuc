apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: dynamic-auth   # NOTE: DO NOT CHANGE THIS NAME, IT IS REFERENCED IN THE VaultAuth CRD.ITS SAME FOR ALL NAMESPACES.
  namespace: default
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-operator-readonly-dynamic
    serviceAccount: vault-secrets-operator   # NOTE: DO NOT CHANGE THIS NAME, IT IS REFERENCED IN THE VaultAuth CRD.ITS SAME FOR ALL NAMESPACES.
    audiences:
      - vault