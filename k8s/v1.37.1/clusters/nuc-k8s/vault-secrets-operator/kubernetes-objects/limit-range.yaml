apiVersion: v1
kind: LimitRange
metadata:
  name: vault-secret-operator-resources
  namespace: vault-secrets-operator
spec:
  limits:
    - type: Container
      defaultRequest:        # applied if requests are omitted
        cpu: 10m
        memory: 64Mi
      default:               # applied if limits are omitted
        cpu: 300m
        memory: 512Mi
      min:                   # optional: reject anything below this
        cpu: 5m
        memory: 8Mi
      max:                   # optional: reject anything above this
        cpu: 1
        memory: 1536Mi
