apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  annotations:
  labels:
    dashboards: grafana
  name: grafana
  namespace: grafana
spec:
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 100Mi
      storageClassName: "ceph-block" # Customize storage class if needed
  client:
    timeout: 5
  config:
    analytics:
      check_for_updates: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    log:
      mode: console
    security:
      disable_gravatar: "false"
  deployment:
    spec:
      replicas: 1
      strategy:
        type: Recreate
      template:
        metadata:
          annotations:
#              vault.security.banzaicloud.io/vault-addr: https://vault-dev.vault.svc.cluster.local:8200
#              vault.security.banzaicloud.io/vault-role: vault-init-readonly
#              vault.security.banzaicloud.io/vault-path: kubernetes-insecure
#              vault.security.banzaicloud.io/vault-skip-verify: "true"
        spec:
          containers:
            - name: grafana
              securityContext:
                readOnlyRootFilesystem: false
                runAsUser: 1001
                runAsGroup: 1001
                runAsNonRoot: true
              env:
  #                - name: GF_SECURITY_ADMIN_USER
  #                  value: vault:secrets/data/dev/grafana/default#user
  #                - name: GF_SECURITY_ADMIN_PASSWORD
  #                  value: vault:secrets/data/dev/grafana/default#password
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  version: 13.0.1
