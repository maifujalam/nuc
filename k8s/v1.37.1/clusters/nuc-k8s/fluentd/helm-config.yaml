## Add fluentd config files from K8s configMaps
##
configMapConfigs: []
#  - fluentd-prometheus-conf
#  - fluentd-systemd-conf

## Fluentd configurations:
##
fileConfigs:
  01_sources.conf: |-
    ## logs from podman
    <source>
      @type tail
      @id in_tail_container_logs
      @label @KUBERNETES
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      enable_watch_timer false
      refresh_interval 60
      <parse>
        @type multi_format
        <pattern>
          format json
          time_key time
          time_type string
          time_format "%Y-%m-%dT%H:%M:%S.%NZ"
          keep_time_key false
        </pattern>
        <pattern>
          format regexp
          expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
          time_format '%Y-%m-%dT%H:%M:%S.%N%z'
          keep_time_key false
        </pattern>
      </parse>
      emit_unmatched_lines true
    </source>
  
    # expose metrics in prometheus format
    <source>
      @type prometheus
      bind 0.0.0.0
      port 24231
      metrics_path /metrics
    </source>

  02_filters.conf: |-
    <label @KUBERNETES>
      <match kubernetes.var.log.containers.fluentd**>
        @type relabel
        @label @FLUENT_LOG
      </match>
  
      <filter kubernetes.**>
        @type kubernetes_metadata
        @id filter_kube_metadata
        skip_labels false
        skip_container_metadata false
        skip_namespace_metadata true
        skip_master_url true
        de_dot true
        de_dot_separator _
      </filter>
  
      # Flatten nested docker/kubernetes objects
      <filter kubernetes.**>
        @type record_transformer
        enable_ruby true
        <record>
          docker_id ${record["docker"] && record["docker"]["container_id"]}
          kubernetes_container ${record["kubernetes"] && record["kubernetes"]["container_name"]}
          kubernetes_namespace ${record["kubernetes"] && record["kubernetes"]["namespace_name"]}
          kubernetes_pod ${record["kubernetes"] && record["kubernetes"]["pod_name"]}
          kubernetes_host ${record["kubernetes"] && record["kubernetes"]["host"]}
        </record>
        remove_keys docker,kubernetes
      </filter>
  
      # Normalize timestamp to ISO8601 without nanoseconds, fallback if missing
      <filter kubernetes.**>
        @type record_transformer
        enable_ruby true
        <record>
          @timestamp ${record["@timestamp"] || Time.now.utc.iso8601}
        </record>
      </filter>
  
      <match **>
        @type relabel
        @label @DISPATCH
      </match>
    </label>

  03_dispatch.conf: |-
    <label @DISPATCH>
      <filter **>
        @type prometheus
        <metric>
          name fluentd_input_status_num_records_total
          type counter
          desc The total number of incoming records
          <labels>
            tag ${tag}
            hostname ${hostname}
          </labels>
        </metric>
      </filter>

      <match **>
        @type relabel
        @label @OUTPUT
      </match>
    </label>

  04_outputs.conf: |-
    <label @OUTPUT>
      <match **>
        @type elasticsearch
        host "elasticsearch-es-http"
        port 9200
        scheme https
        ssl_verify false
        user elastic
        password "lQmFPWcMp3IwWz2lcrd5Hctk"
  
        verify_es_version_at_startup false
        default_elasticsearch_version 8
        suppress_type_name true
  
        logstash_format true
        logstash_prefix k8s
        time_key @timestamp
  
        template_overwrite false
        enable_ilm false
        request_timeout 60s
        reload_connections true
        <buffer>
          @type file
          path /var/log/fluentd-buffers/k8s.buffer
          flush_interval 2s
          retry_max_interval 30
          retry_forever true
          chunk_limit_size 2M
          total_limit_size 4G
          overflow_action drop_oldest_chunk
        </buffer>
      </match>
    </label>

ingress:
  enabled: false

