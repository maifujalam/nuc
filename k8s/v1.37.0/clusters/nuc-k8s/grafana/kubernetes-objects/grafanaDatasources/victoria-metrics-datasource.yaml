apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-metrics-datasource
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  datasource:
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://vmsingle-vm-dev-victoria-metrics-k8s-stack.vm.svc.cluster.local.:8428
    isDefault: true
    jsonData:
      timeInterval: "30s"
      httpMethod: POST
      tlsSkipVerify: true