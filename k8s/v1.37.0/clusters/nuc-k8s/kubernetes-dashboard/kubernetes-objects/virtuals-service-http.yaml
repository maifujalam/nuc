apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kubernetes-dashboard-virtual-service
  namespace: kubernetes-dashboard
spec:
  hosts:
    - dashboard.maifuj.com
  gateways:
    - istio-ingress/gateway-https
  http:
    - route:
        - destination:
            host: kubernetes-dashboard-dev-kong-proxy.kubernetes-dashboard.svc.cluster.local
            port:
              number: 80
