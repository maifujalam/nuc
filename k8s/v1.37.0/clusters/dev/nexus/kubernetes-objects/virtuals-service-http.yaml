apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: nexus-virtual-service
  namespace: nexus
spec:
  hosts:
    - nexus.maifuj.com
  gateways:
    - istio-ingress/gateway-https
  http:
    - route:
        - destination:
            host: nexus-dev-nexus3.nexus.svc.cluster.local
            port:
              number: 8081
