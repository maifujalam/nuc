##################################################################################################
# This file defines the services, service accounts, and deployments for the Bookinfo sample.
#
# To apply all 4 Bookinfo services, their corresponding service accounts, and deployments:
#
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml
#
# Alternatively, you can deploy any resource separately:
#
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l service=reviews # reviews Service
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l account=reviews # reviews ServiceAccount
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l app=reviews,version=v3 # reviews-v3 Deployment
##################################################################################################

##################################################################################################
# Details service
##################################################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: book-info
---
apiVersion: v1
kind: Service
metadata:
  name: details
  namespace: book-info
  labels:
    app: details
    service: details
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-details
  namespace: book-info
  labels:
    account: details
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: details-v1
  namespace: book-info
  labels:
    app: details
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
      annotations:
        vault.security.banzaicloud.io/vault-addr: "https://vault-dev.vault.svc.cluster.local:8200"
        vault.security.banzaicloud.io/vault-role: "vault-init-readonly"
        vault.security.banzaicloud.io/vault-path: "kubernetes-insecure"
        vault.security.banzaicloud.io/vault-skip-verify: "true"
    spec:
      serviceAccountName: default
      containers:
      - name: details
        image: registry.istio.io/release/examples-bookinfo-details-v1:1.20.3
        imagePullPolicy: IfNotPresent
        env:
          # Assuming you are using KV-v2, the path usually includes /data/
          - name: MY_ENV
            value: vault:secrets/data/dev/ttyd-k9s/default#user
          - name: MY_ENV2
            value: vault:secrets/data/dev/ttyd-k9s/default#password
        ports:
        - containerPort: 9080
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
