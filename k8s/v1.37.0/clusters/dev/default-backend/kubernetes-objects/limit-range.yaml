apiVersion: v1
kind: LimitRange
metadata:
  name: default-backend-resources
  namespace: default-backend
spec:
  limits:
    - type: Container
      defaultRequest:        # applied if requests are omitted
        cpu: 10m
        memory: 64Mi
      default:               # applied if limits are omitted
        cpu: 50m
        memory: 64Mi
      min:                   # optional: reject anything below this
        cpu: 10m
        memory: 16Mi
      max:                   # optional: reject anything above this
        cpu: 100m
        memory: 128Mi