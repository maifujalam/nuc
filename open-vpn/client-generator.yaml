---
- name: Create an OpenVPN client
  hosts: bastion
  become: true
  gather_facts: false

  vars_prompt:
    - name: ca_passphrase
      prompt: "Enter the existing OpenVPN CA private-key passphrase"
      private: true

  vars:
    easyrsa_bin: /usr/local/bin/easyrsa
    pki_dir: /home/ubuntu/openvpn-ca/pki

    ca_cert: /etc/openvpn/server/ca.crt
    tls_key: /etc/openvpn/server/ta.key
    ccd_dir: /etc/openvpn/ccd

    client_dir: /home/ubuntu

    vpn_subnet: 10.8.0.0/24
    vpn_server_ip: 10.8.0.1
    vpn_netmask: 255.255.255.0

    vpn_endpoint: 13.207.12.184
    vpn_port: 1194

  tasks:

    - name: Validate client name
      ansible.builtin.assert:
        that:
          - client_name is defined
          - client_name is match('^[A-Za-z0-9_-]+$')
        fail_msg: "Supply a valid client_name using letters, numbers, hyphens or underscores."

    - name: Require client IP
      ansible.builtin.assert:
        that:
          - client_ip is defined
        fail_msg: "Supply client_ip, for example 10.8.0.10."

    - name: Validate tunnel mode
      ansible.builtin.assert:
        that:
          - tunnel_mode is defined
          - tunnel_mode in ['full', 'split']
        fail_msg: "tunnel_mode must be either 'full' or 'split'."

    - name: Validate client IP belongs to the VPN subnet
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress, sys
            ip = ipaddress.ip_address(sys.argv[1])
            net = ipaddress.ip_network("10.8.0.0/24")

            reserved = {
                ipaddress.ip_address("10.8.0.1"),
                net.network_address,
                net.broadcast_address,
            }

            if ip not in net or ip in reserved:
                sys.exit("IP must be an available host in 10.8.0.0/24")
          - "{{ client_ip }}"
      changed_when: false

    - name: Verify CA certificate matches the server CA
      ansible.builtin.shell: |
        set -eu

        server_fp="$(openssl x509 -in /etc/openvpn/server/ca.crt -noout -fingerprint -sha256)"
        pki_fp="$(openssl x509 -in {{ pki_dir }}/ca.crt -noout -fingerprint -sha256)"

        test "$server_fp" = "$pki_fp"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Check whether client files already exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pki_dir }}/reqs/{{ client_name }}.req"
        - "{{ pki_dir }}/issued/{{ client_name }}.crt"
        - "{{ pki_dir }}/private/{{ client_name }}.key"
        - "{{ ccd_dir }}/{{ client_name }}"
        - "{{ client_dir }}/{{ client_name }}.ovpn"
      register: client_file_checks

    - name: Refuse to overwrite an existing client
      ansible.builtin.assert:
        that:
          - >
            client_file_checks.results
            | selectattr('stat.exists')
            | list
            | length == 0
        fail_msg: >
          Client files already exist. Choose a new client_name
          or inspect the existing client before proceeding.

    - name: Check that the IP is not assigned to another client
      ansible.builtin.shell: |
        set -eu

        if grep -R -E '^[[:space:]]*ifconfig-push[[:space:]]+{{ client_ip | regex_escape }}([[:space:]]|$)' \
        /etc/openvpn/ccd/ 2>/dev/null; then
          echo "IP already exists in a CCD file"
          exit 1
        fi

        if grep -F ",{{ client_ip }}," /var/log/openvpn/status.log 2>/dev/null; then
          echo "IP currently appears in OpenVPN status"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Generate client private key and CSR
      ansible.builtin.command:
        argv:
          - "{{ easyrsa_bin }}"
          - "--pki-dir={{ pki_dir }}"
          - --batch
          - gen-req
          - "{{ client_name }}"
          - nopass
      no_log: true

    - name: Sign the client certificate using the existing CA
      ansible.builtin.expect:
        command: >
          {{ easyrsa_bin }}
          --pki-dir={{ pki_dir }}
          --batch sign-req client {{ client_name }}
        responses:
          'Enter pass phrase for .*ca\.key:': "{{ ca_passphrase }}"
        timeout: 120
        echo: false
      no_log: true

    - name: Verify that the certificate and key were created
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pki_dir }}/issued/{{ client_name }}.crt"
        - "{{ pki_dir }}/private/{{ client_name }}.key"
      register: issued_files

    - name: Require certificate and private key
      ansible.builtin.assert:
        that:
          - issued_files.results | selectattr('stat.exists') | list | length == 2
        fail_msg: "Certificate or private key is missing."

    - name: Configure static VPN IP
      ansible.builtin.copy:
        dest: "{{ ccd_dir }}/{{ client_name }}"
        content: |
          ifconfig-push {{ client_ip }} {{ vpn_netmask }}
        owner: root
        group: root
        mode: "0644"

    - name: Generate client profile
      ansible.builtin.template:
        src: client.ovpn.j2
        dest: "{{ client_dir }}/{{ client_name }}.ovpn"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        force: true

    - name: Report generated client details
      ansible.builtin.debug:
        msg:
          - "Client: {{ client_name }}"
          - "VPN IP: {{ client_ip }}"
          - "Tunnel Mode: {{ tunnel_mode }}"
          - "VPN Endpoint: {{ vpn_endpoint }}"
          - "CCD File: {{ ccd_dir }}/{{ client_name }}"
          - "Profile: {{ client_dir }}/{{ client_name }}.ovpn"