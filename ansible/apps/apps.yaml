- hosts: k8s-master
  become: false
  vars_files:
    - /home/vagrant/nuc/ansible/apps/default-apps/group_vars/all/vault.yml   # vaulted file
  vars:
    PROJECT_PATH: nuc   # File will be  created at home directory
    KUBERNETES_MAJOR_VERSION: v1.37
    KUBERNETES_VERSION: v1.37.0  # add 'v' in at prefix whenever required.
    PACKAGE_DIRECTORY: packages
    USER: vagrant
    MASTER_NODE_IP: 192.168.100.10
    WORKER_1_NODE_IP: 192.168.100.11
    WORKER_2_NODE_IP: 192.168.100.12
    WORKER_3_NODE_IP: 192.168.100.13
    KUBECONFIG_PATH: "/home/vagrant/.kube/config"
  roles:
    - default-apps
