- name: Install argo-cd
  kubernetes.core.helm:
    name: argo-cd
    chart_ref: argo/argo-cd
    release_namespace: argo-cd
    create_namespace: true
    chart_version: 10.1.3
    values:
      installCRDs: true
      global:
        domain: argocd.maifuj.com
      configs:
        params:
          server.insecure: true
        secret:
          argocdServerAdminPassword: "{{ ARGOCD_ADMIN_PASSWORD_HASH }}"
      applicationSet:
        priorityClassName: "system-cluster-critical"
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      controller:
        priorityClassName: "system-cluster-critical"
        resources:
          limits:
            cpu: 500m
            memory: 1.5Gi
          requests:
            cpu: 100m
            memory: 1.5Gi
        service:
          type: NodePort
          nodePorts:
            http: 32080
            https: 32443
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      dex:
        enabled: false
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      redis:
        priorityClassName: "system-cluster-critical"
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      repoServer:
        priorityClassName: "system-cluster-critical"
        resources:
          requests:
            cpu: 100m
            memory: 700Mi
          limits:
            memory: 750Mi
            cpu: 500m
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      server:
        priorityClassName: "system-cluster-critical"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 150Mi
            cpu: 500m
        ingress:
          enabled: false
          ingressClassName: nginx
          annotations:
            kubernetes.io/ingress.class: nginx
            nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
            nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master
      notifications:
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        nodeSelector:
          kubernetes.io/hostname: master

- name: Copy kubeconfig file
  ansible.builtin.fetch:
    src: /home/ubuntu/.kube/config
    dest: "{{ KUBECONFIG_PATH }}"
    flat: yes
  tags: [kubeconfig]

- name: Update kubeconfig with MASTER_IP
  ansible.builtin.replace:
    path: "{{ KUBECONFIG_PATH }}"
    regexp: 'https://master:6443'
    replace: "https://{{ MASTER_NODE_IP }}:6443"
  tags: [kubeconfig]

- name: ArgoCD login # noqa: no-changed-when
  ansible.builtin.shell: "argocd login argocd.maifuj.com --username admin --password {{ ADMIN_PASSWORD }} --insecure"
  tags: [kubeconfig]

- name: Add argocd node to the cluster
  ansible.builtin.shell: argocd cluster add kubernetes-admin@local-k8s --upsert --insecure --yes --label cluster-name=dev --name dev --kubeconfig {{ KUBECONFIG_PATH }}  --grpc-web
  tags: [kubeconfig]

- name: Install Default Apps
  shell: kubectl apply -f /home/{{USER}}/{{PROJECT_PATH}}/k8s/{{KUBERNETES_VERSION}}/bootstrap/
  tags: [kubeconfig]