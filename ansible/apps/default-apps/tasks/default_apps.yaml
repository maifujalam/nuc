- name: ArgoCD login #  argocd login master:31443  --username admin  --password '' --insecure --grpc-web
  ansible.builtin.shell: |
    yes | argocd login master:31443 \  
      --username admin \
      --password '{{ ADMIN_PASSWORD }}' \
      --insecure \
      --grpc-web
  args:
    executable: /bin/bash
  register: argocd_login
  changed_when: false
  no_log: true
  tags:
    - kubeconfig

- name: Debug ArgoCD login result
  ansible.builtin.debug:
    msg: "{{ argocd_login.stdout }}"
  tags:
    - kubeconfig

- name: Debug kubeconfig path
  ansible.builtin.debug:
    msg: "{{ KUBECONFIG_PATH }}"
  tags:
    - kubeconfig

- name: Update kubeconfig with MASTER_IP
  ansible.builtin.replace:
    path: "{{ KUBECONFIG_PATH }}"
    regexp: 'https://master:6443'
    replace: "https://{{ MASTER_NODE_IP }}:6443"
  tags: [kubeconfig]

- name: Add nuc Kubernetes cluster to ArgoCD
  ansible.builtin.shell: |
    argocd cluster add kubernetes-admin@nuc-k8s \ 
      --upsert \
      --insecure \
      --yes \
      --label cluster-name=nuc-k8s \
      --name nuc-k8s \
      --kubeconfig "{{ KUBECONFIG_PATH }}" \
      --grpc-web
  args:
    executable: /bin/bash
  register: argocd_cluster_add
  changed_when: true
  no_log: false
  tags:
    - kubeconfig

- name: Install Default Apps
  ansible.builtin.shell: kubectl apply -f "/home/{{ USER }}/{{ PROJECT_PATH }}/k8s/{{ KUBERNETES_VERSION }}/bootstrap/"
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ KUBECONFIG_PATH }}"
  tags:
    - kubeconfig
