- name: Add helm chart repos
  shell: |
    helm repo add cilium https://helm.cilium.io/;
    helm repo add projectcalico https://docs.tigera.io/calico/charts;
    helm repo add cert-manager https://charts.jetstack.io;
    helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx;
    helm repo add argo https://argoproj.github.io/argo-helm;
    helm repo update;
  ignore_errors: true

- name: Clone repo
  shell: cd;rm -rfv {{PROJECT_PATH}}; git clone https://github.com/maifujalam/{{PROJECT_PATH}}.git
  ignore_errors: true

- name: Install cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    create_namespace: true
    chart_version: 1.20.1
    values:
      kubeProxyReplacement: true
      k8sServiceHost: "{{ MASTER_NODE_IP }}"
      k8sServicePort: 6443

- name: Install Python dependencies required by Kubernetes Ansible modules
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-kubernetes
      - python3-yaml
      - python3-jsonpatch
    state: present
    update_cache: true
  become: true

- name: Recreate route53-credentials-secret
  kubernetes.core.k8s:
    state: present
    namespace: cert-manager
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: route53-credentials-secret
      type: Opaque
      stringData:
        access-key-id: "{{ ACCESS_KEY_ID }}"
        secret-access-key: "{{ SECRET_ACCESS_KEY }}"

