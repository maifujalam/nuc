---
- hosts: k8s-worker-2
  become: false
  vars:
    PROJECT_PATH: nuc  # File will be  created at home directory
    KUBERNETES_MAJOR_VERSION: v1.37
    KUBERNETES_VERSION: 1.37.1  # add 'v' in at prefix whenever required.
    PACKAGE_DIRECTORY: packages
    USER: vagrant
    MASTER_NODE_IP: 192.168.100.10
    WORKER_NODE_IP: 192.168.100.12
    CHRONY_SERVERS:
      - time.google.com
      - time.cloudflare.com
  roles:
    - download-packages
    - configure_node
    - bootstrap_k8s_worker
